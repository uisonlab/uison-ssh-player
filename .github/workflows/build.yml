# SSH player for macOS (universal: Apple silicon + Intel) and Windows x64: tests, clippy, release build and
# zips as artifacts. Runs only for a tag v* (then also a GitHub release of that version) or by hand
# (artifacts only, no release).
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-universal
            os: macos-latest
            target: aarch64-apple-darwin
            extra_target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      # The version lives in Cargo.toml only; the tag must be "v" + that version.
      - name: Check that the tag is Cargo.toml's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="v$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::The tag is ${{ github.ref_name }} but Cargo.toml has $VERSION"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}${{ matrix.extra_target && format(',{0}', matrix.extra_target) || '' }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Clippy
        run: cargo clippy --all-targets --locked --target ${{ matrix.target }} -- -D warnings

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build release (second macOS architecture)
        if: matrix.extra_target
        run: cargo build --release --locked --target ${{ matrix.extra_target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="uison-ssh-player-${{ matrix.name }}"
          mkdir -p dist
          case "${{ runner.os }}" in
            Windows)
              bin=dist/uison-ssh-player.exe
              cp "target/${{ matrix.target }}/release/uison-ssh-player.exe" "$bin"
              (cd dist && 7z a "../$name.zip" uison-ssh-player.exe >/dev/null)
              ;;
            macOS)
              bin=dist/uison-ssh-player
              lipo -create -output "$bin" \
                "target/${{ matrix.target }}/release/uison-ssh-player" \
                "target/${{ matrix.extra_target }}/release/uison-ssh-player"
              # An ad-hoc signature: Apple silicon runs it (not notarized: `xattr -d com.apple.quarantine` after a download).
              codesign --force --sign - "$bin"
              (cd dist && ditto -c -k uison-ssh-player "$GITHUB_WORKSPACE/$name.zip")
              ;;
          esac
          echo "### $name" >> "$GITHUB_STEP_SUMMARY"
          ls -l "$bin" | awk '{printf "Binary size: %.2f MiB (%d bytes)\n", $5/1048576, $5}' | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: uison-ssh-player-${{ matrix.name }}
          path: uison-ssh-player-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
