[package]
name = "uison-ssh-player"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"   # let chains
license = "MIT"
repository = "https://github.com/uisonlab/uison-ssh-player"
description = "Connects to a server over SSH, uploads and runs a uison program in console mode, shows it"
keywords = ["uison", "ssh", "gui", "remote", "player"]
categories = ["gui", "network-programming"]

# SSH lives only here: the framework and the programs know nothing but stdin/stdout.
[dependencies]
uison-player = "0.1"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
# The seed of a new key: the system random source everywhere, Windows included.
getrandom = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
